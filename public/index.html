<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DevOps Release Dashboard</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 480px;
    margin: 60px auto;
    text-align: center;
    color: #1a1a1a;
  }
  #env-status { font-weight: bold; }
  #env-status.stable { color: #1a7f37; }
  #env-status.broken { color: #cf222e; }
  button {
    padding: 10px 18px;
    margin: 8px;
    font-size: 15px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid #d0d7de;
  }
  #deploy-result {
    margin-top: 20px;
    font-weight: bold;
    min-height: 24px;
  }
  #deploy-result.success { color: #1a7f37; }
  #deploy-result.failure { color: #cf222e; }
</style>
</head>
<body>
  <h1>DevOps Release Dashboard</h1>

  <p>Environment status: <span id="env-status" class="stable">Environment Stable</span></p>

  <button id="toggle-btn">Toggle Environment</button>
  <button id="deploy-btn">Deploy</button>

  <div id="deploy-result"></div>

  <script>
    const envStatusEl = document.getElementById('env-status');
    const deployResultEl = document.getElementById('deploy-result');
    const toggleBtn = document.getElementById('toggle-btn');
    const deployBtn = document.getElementById('deploy-btn');

    function renderStatus(env) {
      const stable = env === 'stable';
      envStatusEl.textContent = stable ? 'Environment Stable' : 'Environment Broken';
      envStatusEl.className = stable ? 'stable' : 'broken';
    }

    async function loadStatus() {
      const res = await fetch('/api/status');
      const data = await res.json();
      renderStatus(data.environment);
    }

    toggleBtn.addEventListener('click', async () => {
      const res = await fetch('/api/toggle', { method: 'POST' });
      const data = await res.json();
      renderStatus(data.environment);
      deployResultEl.textContent = '';
      deployResultEl.className = '';
    });

    deployBtn.addEventListener('click', async () => {
      const res = await fetch('/api/deploy', { method: 'POST' });
      const data = await res.json();
      deployResultEl.textContent = data.message;
      deployResultEl.className = data.success ? 'success' : 'failure';
    });

    loadStatus();
  </script>
</body>
</html>
